# Validates GitHub secret SERVICE_ACCOUNT without printing credential JSON.
name: Verify SERVICE_ACCOUNT

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-service-account.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify identity and project (metadata only)
        shell: bash
        run: |
          set +x
          set -euo pipefail
          EXPECTED_PROJECT='servesa-aad53'
          EMAIL="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          PROJECT="$(gcloud config get-value project 2>/dev/null || true)"
          # Prefer token info project without dumping the key file
          TOKEN_PROJECT="$(gcloud projects describe "${EXPECTED_PROJECT}" --format='value(projectId)' 2>/dev/null || true)"
          DISABLED="$(gcloud iam service-accounts describe "${EMAIL}" --project="${EXPECTED_PROJECT}" --format='value(disabled)' 2>/dev/null || echo unknown)"
          echo "auth_success=true"
          echo "service_account_email=${EMAIL}"
          echo "resolved_project=${TOKEN_PROJECT:-$PROJECT}"
          echo "service_account_disabled=${DISABLED}"
          echo "firebaserc_default=$(python3 -c "import json;print(json.load(open('.firebaserc'))['projects']['default'])")"
          if [[ "${EMAIL}" != *"@${EXPECTED_PROJECT}.iam.gserviceaccount.com" ]]; then
            echo "::error::Service account email is not in project ${EXPECTED_PROJECT}"
            exit 1
          fi
          if [[ "${TOKEN_PROJECT:-$PROJECT}" != "${EXPECTED_PROJECT}" ]]; then
            echo "::error::Credential project mismatch"
            exit 1
          fi
          if [[ "${DISABLED}" == "True" || "${DISABLED}" == "true" ]]; then
            echo "::error::Service account is disabled"
            exit 1
          fi
          echo "verification=PASS"

      - name: Cleanup credentials (always)
        if: always()
        shell: bash
        run: |
          set +x
          # google-github-actions/auth cleanup_credentials=true handles default path;
          # belt-and-suspenders for any GOOGLE_APPLICATION_CREDENTIALS under runner temp.
          if [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" && -f "${GOOGLE_APPLICATION_CREDENTIALS}" ]]; then
            rm -f "${GOOGLE_APPLICATION_CREDENTIALS}" || true
          fi
          rm -f "${RUNNER_TEMP}"/gha-creds-*.json 2>/dev/null || true
