# Required CI gate — no production deploy.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'cert/**'
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Record SHA
        run: |
          echo "ci_sha=${GITHUB_SHA}"
          echo "ci_sha=${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Install dependencies
        run: npm ci

      - name: Lint functions (advisory — baseline has pre-existing eslint debt)
        continue-on-error: true
        run: npm run lint -w @servesa/functions

      - name: Type-check functions
        run: npm run type-check -w @servesa/functions

      - name: Test functions
        run: npm test -w @servesa/functions -- --passWithNoTests

      - name: Test case-contract
        run: npm test -w @servesa/case-contract -- --passWithNoTests

      - name: Build functions
        run: npm run build -w @servesa/functions

      - name: Synthetic load bench
        run: npm run test:load:synthetic

      - name: Image similarity fixtures
        run: npm run test:image-similarity
