# Production deploy via GitHub OIDC + Workload Identity Federation (preferred).
# Manual only — no auto-deploy on push to main.
# See docs/security/OIDC_WIF_MIGRATION.md and docs/architecture/ADR_GITHUB_WIF.md.
#
# Required GitHub Actions variables (Settings → Variables):
#   WORKLOAD_IDENTITY_PROVIDER  — full provider resource name from 06_oidc_github.sh
#   DEPLOY_SERVICE_ACCOUNT      — github-actions-deploy@servesa-aad53.iam.gserviceaccount.com
#
# Deprecated fallback (temporary): secret SERVICE_ACCOUNT (JSON key).
# Remove the JSON key path once WIF verification passes.
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: Deploy Cloud Functions
        type: boolean
        default: true
      deploy_hosting:
        description: Deploy Firebase Hosting (Next.js webframeworks)
        type: boolean
        default: true
      deploy_rules:
        description: Deploy Firestore + Storage rules
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ID: servesa-aad53
    steps:
      - uses: actions/checkout@v4

      - name: Record deployed SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "deployed_sha=${GITHUB_SHA}"
          echo "deployed_ref=${GITHUB_REF}"
          {
            echo "### Deploy record"
            echo "deployed_sha=\`${GITHUB_SHA}\`"
            echo "deployed_ref=\`${GITHUB_REF}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Authenticate via WIF (preferred)
        id: auth-wif
        if: ${{ vars.WORKLOAD_IDENTITY_PROVIDER != '' && vars.DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
          export_environment_variables: true

      - name: Authenticate via SERVICE_ACCOUNT JSON (deprecated)
        id: auth-json
        if: ${{ vars.WORKLOAD_IDENTITY_PROVIDER == '' || vars.DEPLOY_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
          export_environment_variables: true

      - name: Auth path notice
        shell: bash
        run: |
          set +x
          if [[ -n "${{ vars.WORKLOAD_IDENTITY_PROVIDER }}" && -n "${{ vars.DEPLOY_SERVICE_ACCOUNT }}" ]]; then
            echo "auth_mode=wif"
            echo "Using Workload Identity Federation (preferred)."
          else
            echo "auth_mode=credentials_json_deprecated"
            echo "::warning::WIF vars not set (WORKLOAD_IDENTITY_PROVIDER / DEPLOY_SERVICE_ACCOUNT). Falling back to deprecated secrets.SERVICE_ACCOUNT JSON key. See docs/security/OIDC_WIF_MIGRATION.md"
          fi

      - uses: google-github-actions/setup-gcloud@v2

      - name: Guard project binding
        shell: bash
        run: |
          set +x
          set -euo pipefail
          EMAIL="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "deploy_sa=${EMAIL}"
          gcloud config set project "${PROJECT_ID}"
          ACTUAL="$(gcloud config get-value project)"
          if [[ "${ACTUAL}" != "${PROJECT_ID}" ]]; then
            echo "::error::Refusing deploy: project is ${ACTUAL}"
            exit 1
          fi
          if [[ "${EMAIL}" != *"@${PROJECT_ID}.iam.gserviceaccount.com" ]]; then
            echo "::error::Refusing deploy: SA not in ${PROJECT_ID}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build functions
        run: npm run build -w @servesa/functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.35.1

      - name: Deploy rules
        if: ${{ inputs.deploy_rules }}
        run: firebase deploy --only firestore:rules,storage --project "${PROJECT_ID}" --non-interactive --force

      - name: Deploy functions
        if: ${{ inputs.deploy_functions }}
        run: firebase deploy --only functions --project "${PROJECT_ID}" --non-interactive --force

      - name: Deploy hosting
        if: ${{ inputs.deploy_hosting }}
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: firebase deploy --only hosting --project "${PROJECT_ID}" --non-interactive --force

      - name: Cleanup credentials (always)
        if: always()
        shell: bash
        run: |
          set +x
          if [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" && -f "${GOOGLE_APPLICATION_CREDENTIALS}" ]]; then
            rm -f "${GOOGLE_APPLICATION_CREDENTIALS}" || true
          fi
          rm -f "${RUNNER_TEMP}"/gha-creds-*.json 2>/dev/null || true
