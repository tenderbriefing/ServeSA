# Firebase Hosting PR preview.
# Prefer WIF when WORKLOAD_IDENTITY_PROVIDER + DEPLOY_SERVICE_ACCOUNT are configured.
# FirebaseExtended/action-hosting-deploy still accepts firebaseServiceAccount (JSON).
# Until that action natively supports WIF-only auth, keep secrets.SERVICE_ACCOUNT as
# the preview credential path so PRs do not break before WIF is live.
#
# Condition: if WIF vars are set, authenticate via google-github-actions/auth (WIF)
# so ADC is available; the hosting action may still need firebaseServiceAccount until
# migrated. See docs/security/OIDC_WIF_MIGRATION.md.
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Authenticate to Google Cloud (WIF when available)
        id: auth
        if: ${{ vars.WORKLOAD_IDENTITY_PROVIDER != '' && vars.DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
          export_environment_variables: true

      - run: npm ci

      # Preview hosting: action currently expects firebaseServiceAccount JSON.
      # Keep SERVICE_ACCOUNT secret until hosting-deploy supports pure WIF / ADC.
      # Do not fail the job solely because WIF is not configured yet.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.SERVICE_ACCOUNT }}
          projectId: servesa-aad53
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
