# Firebase Hosting PR preview via WIF / ADC (no JSON key).
# Uses google-github-actions/auth OIDC + firebase hosting:channel:deploy.
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: servesa-aad53
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Authenticate via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          cleanup_credentials: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v2

      - run: npm ci

      - name: Build web static export
        run: npm run build -w @servesa/web

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.35.1

      - name: Deploy Hosting preview channel
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL="pr-${{ github.event.pull_request.number }}"
          firebase hosting:channel:deploy "${CHANNEL}" \
            --project "${PROJECT_ID}" \
            --expires 7d \
            --non-interactive | tee /tmp/hosting_preview.txt
          URL="$(grep -Eo 'https://[^ ]+' /tmp/hosting_preview.txt | head -1 || true)"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Hosting preview"
            echo "channel=\`${CHANNEL}\`"
            echo "url=${URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment preview URL
        if: ${{ steps.preview.outputs.url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Firebase Hosting preview: ${url}`
            })

      - name: Cleanup credentials (always)
        if: always()
        shell: bash
        run: |
          set +x
          if [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" && -f "${GOOGLE_APPLICATION_CREDENTIALS}" ]]; then
            rm -f "${GOOGLE_APPLICATION_CREDENTIALS}" || true
          fi
          rm -f "${RUNNER_TEMP}"/gha-creds-*.json 2>/dev/null || true
